<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beda Alam Absensi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-[#D6E9FF] dark:bg-slate-900 min-h-screen p-6 md:p-12 font-['Plus_Jakarta_Sans'] transition-colors duration-500">
    <div class="max-w-5xl mx-auto space-y-6">
        <header class="bg-white dark:bg-slate-800 rounded-[45px] p-6 flex flex-col md:flex-row justify-between items-center shadow-lg">
            <div class="flex items-center gap-5">
                <img src="assets/logo.png" alt="Logo" class="w-16 h-16 object-contain">
                <div>
                    <h1 class="text-[#2D5BFF] text-2xl font-extrabold uppercase leading-tight">BEDA ALAM ROLEPLAY</h1>
                    <p class="text-[#1E2A78] dark:text-slate-400 text-xs font-bold tracking-widest uppercase">Attendance System</p>
                </div>
            </div>
            <div class="flex items-center gap-4 mt-4 md:mt-0">
                <button id="darkModeToggle" class="p-3 bg-gray-100 dark:bg-slate-700 rounded-2xl">🌙</button>
                <button onclick="accessAdmin()" class="bg-[#2D5BFF] text-white px-8 py-4 rounded-full font-bold text-sm uppercase">ADMIN PANEL</button>
            </div>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white/60 dark:bg-slate-800/60 p-6 rounded-3xl flex justify-between items-center border border-white/40 shadow-sm">
                <span class="text-[#2D5BFF] font-bold text-xs">HIGH RANK</span>
                <span id="count-HIGH-RANK" class="font-black text-xl">0</span>
            </div>
            <div class="bg-white/60 dark:bg-slate-800/60 p-6 rounded-3xl flex justify-between items-center border border-white/40 shadow-sm">
                <span class="text-[#2D5BFF] font-bold text-xs">SENIOR</span>
                <span id="count-SENIOR" class="font-black text-xl">0</span>
            </div>
            <div class="bg-white/60 dark:bg-slate-800/60 p-6 rounded-3xl flex justify-between items-center border border-white/40 shadow-sm">
                <span class="text-[#2D5BFF] font-bold text-xs">JUNIOR</span>
                <span id="count-JUNIOR" class="font-black text-xl">0</span>
            </div>
            <div class="bg-white/60 dark:bg-slate-800/60 p-6 rounded-3xl flex justify-between items-center border border-white/40 shadow-sm">
                <span class="text-[#2D5BFF] font-bold text-xs">INTERN</span>
                <span id="count-INTERN" class="font-black text-xl">0</span>
            </div>
        </div>

        <input type="text" id="employeeSearch" placeholder="SEARCH EMPLOYEE" class="w-full bg-white/50 dark:bg-slate-800/50 rounded-2xl py-5 px-6 text-center font-bold text-[#2D5BFF] focus:outline-none transition-all">

        <div id="employee-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 pb-10"></div>
    </div>

    <script src="config.js"></script>
    <script type="module" src="script.js"></script>
    <script>
        function accessAdmin() {
            if(prompt("Admin Password:") === GLOBAL_SETTINGS.ADMIN_PASSWORD) {
                window.location.href = "admin.html";
            } else { alert("Access Denied"); }
        }
        const toggle = document.getElementById('darkModeToggle');
        if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        toggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });
    </script>
</body>
</html>
