<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Beda Alam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-[#D6E9FF] dark:bg-slate-900 min-h-screen p-6 md:p-12 font-['Plus_Jakarta_Sans'] transition-colors duration-500">

    <div class="max-w-5xl mx-auto space-y-6">
        <header class="bg-white dark:bg-slate-800 rounded-[45px] p-6 md:px-10 flex flex-col md:flex-row justify-between items-center shadow-lg">
            <div class="flex items-center gap-5">
                <a href="index.html"><img src="assets/logo.png" alt="BA Logo" class="w-20 h-20 object-contain"></a>
                <div>
                    <h1 class="text-[#2D5BFF] dark:text-blue-400 text-2xl font-[800] uppercase">ADMIN PANEL</h1>
                    <p class="text-[#1E2A78] dark:text-slate-300 text-sm font-bold uppercase tracking-widest">Beda Alam Roleplay</p>
                </div>
            </div>
            <div class="flex items-center gap-4 mt-4 md:mt-0">
                <button id="darkModeToggle" class="p-3 bg-gray-100 dark:bg-slate-700 rounded-2xl">
                    <span class="dark:hidden">🌙</span>
                    <span class="hidden dark:block">☀️</span>
                </button>
                <a href="index.html" class="bg-[#2D5BFF] text-white px-8 py-3 rounded-full font-bold shadow-lg text-sm">DASHBOARD</a>
            </div>
        </header>

        <section class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border border-white dark:border-slate-700 rounded-[35px] p-8 shadow-sm">
            <h2 class="text-[#2D5BFF] dark:text-blue-400 font-extrabold text-xl mb-8 border-b-2 border-blue-100 dark:border-slate-700 pb-2 inline-block uppercase tracking-wider">Hire Employee</h2>
            <form id="hireForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="font-bold text-[#1E2A78] dark:text-slate-200">Employee Name</label>
                    <input type="text" id="hireName" required placeholder="INPUT NAME..." class="md:col-span-2 bg-white dark:bg-slate-700 border border-blue-100 dark:border-slate-600 rounded-2xl py-4 px-6 font-bold text-[#2D5BFF] focus:ring-2 focus:ring-blue-400 outline-none shadow-sm">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="font-bold text-[#1E2A78] dark:text-slate-200">Set Password</label>
                    <input type="password" id="hirePass" required placeholder="SET PASSWORD..." class="md:col-span-2 bg-white dark:bg-slate-700 border border-blue-100 dark:border-slate-600 rounded-2xl py-4 px-6 font-bold text-[#2D5BFF] focus:ring-2 focus:ring-blue-400 outline-none shadow-sm">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
                    <label class="font-bold text-[#1E2A78] dark:text-slate-200">Grade</label>
                    <select id="hireGrade" class="md:col-span-1 bg-white dark:bg-slate-700 border border-blue-100 dark:border-slate-600 rounded-2xl py-4 px-6 text-[#2D5BFF] font-[800] outline-none shadow-sm">
                        <option value="HIGH RANK">HIGH RANK</option>
                        <option value="SENIOR">SENIOR</option>
                        <option value="JUNIOR">JUNIOR</option>
                        <option value="INTERN">INTERN</option>
                    </select>
                </div>
                <div class="flex justify-end pt-4">
                    <button type="submit" class="bg-[#2D5BFF] text-white px-14 py-4 rounded-full font-[900] shadow-blue-200 dark:shadow-none shadow-xl uppercase transition-all active:scale-95">Submit Data</button>
                </div>
            </form>
        </section>

        <section class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border border-white dark:border-slate-700 rounded-[35px] p-8 shadow-sm">
            <h2 class="text-[#2D5BFF] dark:text-blue-400 font-extrabold text-xl mb-8 border-b-2 border-blue-100 dark:border-slate-700 pb-2 inline-block uppercase">Employee Management</h2>
            <div id="manage-list" class="space-y-4">
                <p class="text-center text-blue-400 animate-pulse font-bold uppercase">Loading Data...</p>
            </div>
        </section>
    </div>

    <script src="config.js"></script>
    <script type="module">
        import { Storage } from './data/storage.js';

        // DARK MODE LOGIC (Fixed)
        const toggle = document.getElementById('darkModeToggle');
        if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        
        toggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });

        // HIRE EMPLOYEE LOGIC
        const hireForm = document.getElementById('hireForm');
        hireForm.onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('hireName').value;
            const pass = document.getElementById('hirePass').value;
            const grade = document.getElementById('hireGrade').value;

            try {
                const employees = await Storage.getEmployees();
                employees.push({
                    id: Date.now(),
                    name: name,
                    rank: grade,
                    password: pass,
                    currentHours: 0
                });
                await Storage.saveEmployees(employees);
                alert("EMPLOYEE ADDED SUCCESSFULLY!");
                hireForm.reset();
                window.location.reload();
            } catch (err) {
                alert("ERROR: " + err.message);
            }
        };

        // RENDER MANAGEMENT LIST (Optional but helpful)
        async function loadManagement() {
            const list = document.getElementById('manage-list');
            const emps = await Storage.getEmployees();
            if(emps.length === 0) {
                list.innerHTML = `<p class="text-center text-slate-400 font-bold uppercase">No Employee Found</p>`;
                return;
            }
            list.innerHTML = emps.map(emp => `
                <div class="flex justify-between items-center bg-white dark:bg-slate-700 p-4 rounded-2xl border border-blue-50 dark:border-slate-600 shadow-sm">
                    <div>
                        <p class="font-black text-[#2D5BFF] dark:text-blue-400">${emp.name}</p>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">${emp.rank}</p>
                    </div>
                    <button onclick="deleteEmp(${emp.id})" class="text-red-400 hover:text-red-600 font-bold text-xs">REMOVE</button>
                </div>
            `).join('');
        }

        window.deleteEmp = async (id) => {
            if(confirm("Delete this employee?")) {
                const emps = await Storage.getEmployees();
                const filtered = emps.filter(e => e.id != id);
                await Storage.saveEmployees(filtered);
                window.location.reload();
            }
        }

        loadManagement();
    </script>
</body>
</html>
